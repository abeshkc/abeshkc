<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #e94560;
    }

    #status {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      min-height: 1.5rem;
      color: #a8dadc;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
    }

    .cell {
      width: 110px;
      height: 110px;
      background: #f0f0f5;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #d8d8ee;
      transform: scale(1.05);
    }

    .cell.x { color: #e94560; }
    .cell.o { color: #2176ff; }

    .cell.win {
      background: #ffe066;
      animation: pulse 0.5s ease;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    #scores {
      display: flex;
      gap: 2rem;
      margin: 1.5rem 0;
      font-size: 1rem;
    }

    .score-box {
      text-align: center;
      background: #16213e;
      padding: 0.6rem 1.4rem;
      border-radius: 10px;
    }

    .score-box .label { color: #888; font-size: 0.8rem; letter-spacing: 2px; }
    .score-box .value { font-size: 1.8rem; font-weight: bold; margin-top: 2px; }
    .score-box.x .value { color: #e94560; }
    .score-box.o .value { color: #2176ff; }
    .score-box.draw .value { color: #f4a261; }

    #controls {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }

    button {
      padding: 0.7rem 2rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: background 0.2s, transform 0.1s;
    }

    #restart {
      background: #e94560;
      color: #fff;
    }

    #restart:hover { background: #c73652; transform: scale(1.04); }

    #mode-toggle {
      background: #16213e;
      color: #2176ff;
      border: 2px solid #2176ff;
    }

    #mode-toggle:hover { background: #0f3460; transform: scale(1.04); }
    #mode-toggle.active { background: #0f3460; border-color: #e94560; color: #e94560; }
  </style>
</head>
<body>

  <h1>Tic Tac Toe</h1>
  <div id="status"></div>

  <div id="board">
    <div class="cell" data-i="0"></div>
    <div class="cell" data-i="1"></div>
    <div class="cell" data-i="2"></div>
    <div class="cell" data-i="3"></div>
    <div class="cell" data-i="4"></div>
    <div class="cell" data-i="5"></div>
    <div class="cell" data-i="6"></div>
    <div class="cell" data-i="7"></div>
    <div class="cell" data-i="8"></div>
  </div>

  <div id="scores">
    <div class="score-box x">
      <div class="label">X WINS</div>
      <div class="value" id="score-x">0</div>
    </div>
    <div class="score-box draw">
      <div class="label">DRAWS</div>
      <div class="value" id="score-draw">0</div>
    </div>
    <div class="score-box o">
      <div class="label">O WINS</div>
      <div class="value" id="score-o">0</div>
    </div>
  </div>

  <div id="controls">
    <button id="mode-toggle">vs AI</button>
    <button id="restart">New Game</button>
  </div>

  <script>
    const WINS = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    let board, current, gameOver, scores;
    let aiMode = false;
    let aiThinking = false;

    function init() {
      board = Array(9).fill(null);
      current = 'X';
      gameOver = false;
      aiThinking = false;
      scores = scores || { X: 0, O: 0, D: 0 };
      render();
    }

    function render() {
      document.querySelectorAll('.cell').forEach(cell => {
        const i = +cell.dataset.i;
        cell.textContent = board[i] || '';
        cell.className = 'cell' + (board[i] ? ' taken ' + board[i].toLowerCase() : '');
      });
      if (!gameOver) {
        const isAiTurn = aiMode && current === 'O';
        document.getElementById('status').textContent =
          isAiTurn ? 'AI is thinking…' : `Player ${current}'s turn`;
      }
      document.getElementById('score-x').textContent = scores.X;
      document.getElementById('score-o').textContent = scores.O;
      document.getElementById('score-draw').textContent = scores.D;
    }

    function getWinner(b) {
      const line = WINS.find(([p,q,r]) => b[p] && b[p] === b[q] && b[p] === b[r]);
      return line ? b[line[0]] : null;
    }

    // Minimax — AI plays as 'O' (maximizing), human as 'X' (minimizing)
    function minimax(b, isMax, depth) {
      const winner = getWinner(b);
      if (winner === 'O') return 10 - depth;
      if (winner === 'X') return depth - 10;
      if (b.every(Boolean)) return 0;

      let best = isMax ? -Infinity : Infinity;
      for (let i = 0; i < 9; i++) {
        if (!b[i]) {
          b[i] = isMax ? 'O' : 'X';
          const score = minimax(b, !isMax, depth + 1);
          b[i] = null;
          best = isMax ? Math.max(best, score) : Math.min(best, score);
        }
      }
      return best;
    }

    function getBestMove() {
      let best = -Infinity, move = -1;
      for (let i = 0; i < 9; i++) {
        if (!board[i]) {
          board[i] = 'O';
          const score = minimax(board, false, 0);
          board[i] = null;
          if (score > best) { best = score; move = i; }
        }
      }
      return move;
    }

    function resolveMove(i) {
      board[i] = current;
      render();

      const winLine = WINS.find(([p,q,r]) => board[p] && board[p] === board[q] && board[p] === board[r]);
      if (winLine) {
        gameOver = true;
        scores[current]++;
        document.getElementById('status').textContent =
          aiMode && current === 'O' ? 'AI wins!' : `Player ${current} wins!`;
        winLine.forEach(idx =>
          document.querySelector(`[data-i="${idx}"]`).classList.add('win')
        );
      } else if (board.every(Boolean)) {
        gameOver = true;
        scores.D++;
        document.getElementById('status').textContent = "It's a draw!";
      } else {
        current = current === 'X' ? 'O' : 'X';
        render();
        if (aiMode && current === 'O' && !gameOver) {
          aiThinking = true;
          setTimeout(() => {
            aiThinking = false;
            if (!gameOver) resolveMove(getBestMove());
          }, 400);
        }
      }
    }

    document.getElementById('board').addEventListener('click', e => {
      const cell = e.target.closest('.cell');
      if (!cell || gameOver || aiThinking) return;
      if (aiMode && current === 'O') return;
      const i = +cell.dataset.i;
      if (board[i]) return;
      resolveMove(i);
    });

    document.getElementById('mode-toggle').addEventListener('click', () => {
      aiMode = !aiMode;
      const btn = document.getElementById('mode-toggle');
      btn.textContent = aiMode ? '2 Players' : 'vs AI';
      btn.classList.toggle('active', aiMode);
      scores = { X: 0, O: 0, D: 0 };
      init();
    });

    document.getElementById('restart').addEventListener('click', init);

    init();
  </script>
</body>
</html>
